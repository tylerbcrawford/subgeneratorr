[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subgeneratorr"
version = "3.1.0"
description = "Generate and translate SRT subtitles — Deepgram Nova-3 or fully-local Whisper transcription plus LLM translation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "deepgram-sdk==3.*",
    "deepgram-captions==1.*",
]

# The repo uses a flat sibling-directory layout (core/, cli/, web/), so disable
# automatic package discovery. This file exists for metadata and tool config
# (e.g. ruff); the CLI is distributed via Docker, not pip. See note below.
[tool.setuptools]
py-modules = []

# NOTE: A pip-installable console entry point is not wired up here because
# the repo uses a sibling-directory layout (core/, cli/, web/) rather than
# an importable package. The CLI is distributed via Docker (see README).
# Restructuring the package layout is out of scope for this release.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort
select = ["E", "F", "W", "I"]
# E501: line-too-long — don't fight line length in an established codebase
# E402: module-import-not-at-top — intentional in cli/generate_subtitles.py (sys.path bootstrap)
ignore = ["E501", "E402"]
