# Subgeneratorr - AI-powered subtitle generation
# https://github.com/tylerbcrawford/subgeneratorr
#
# Quick start (pulls the published images — no clone or build needed):
#   1. Save this file as docker-compose.yml
#   2. Save .env.example as .env and set your DEEPGRAM_API_KEY and MEDIA_PATH
#   3. docker compose up -d    (Web UI at http://localhost:5000)
#
# Pin a release with SUBGENERATORR_VERSION=3.3.1 in .env (default: latest).
# Working from a clone? `docker compose up -d --build` builds from source instead.
#
# CLI usage:
#   docker compose run --rm cli

services:
  # ==========================================================================
  # Redis - Task queue broker
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Web UI - Gunicorn app server
  # ==========================================================================
  web:
    image: ghcr.io/tylerbcrawford/subgeneratorr-web:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in .env}
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
      LOG_ROOT: /logs
      SETTINGS_PATH: ${SETTINGS_PATH:-/logs/subgeneratorr-settings.json}  # saved Customize-languages choices
      DEFAULT_MODEL: ${DEFAULT_MODEL:-nova-3}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}  # local Ollama endpoint for free offline keyterms and translation (e.g. http://host.docker.internal:11434)
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_THINKING_HEADROOM: ${OLLAMA_THINKING_HEADROOM:-8192}  # extra tokens so thinking models (qwen3) can answer
      DISABLE_AUTH: ${DISABLE_AUTH:-true}  # Default: auth disabled for local use. Set to false + configure a reverse proxy for remote/production access
      FRAME_OPTIONS: ${FRAME_OPTIONS-SAMEORIGIN}  # set FRAME_OPTIONS= (empty) in .env to embed the UI in a dashboard iframe
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media  # read-write: web writes keyterms to Transcripts/Keyterms/
      - logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/healthz | grep ok"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets OLLAMA_HOST reach an Ollama server running on the host

  # ==========================================================================
  # Celery Worker - Background transcription job processing
  # ==========================================================================
  worker:
    image: ghcr.io/tylerbcrawford/subgeneratorr-worker:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: web/Dockerfile
    command: celery -A tasks.celery_app worker --loglevel=INFO -Q transcribe,scan --concurrency=${WORKER_CONCURRENCY:-1}
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in .env}
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
      LOG_ROOT: /logs
      DEFAULT_MODEL: ${DEFAULT_MODEL:-nova-3}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}  # local Ollama endpoint for free offline keyterms and translation (e.g. http://host.docker.internal:11434)
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_THINKING_HEADROOM: ${OLLAMA_THINKING_HEADROOM:-8192}  # extra tokens so thinking models (qwen3) can answer
      CELERYD_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      RESULT_EXPIRES_DAYS: ${RESULT_EXPIRES_DAYS:-7}  # how long batch status and library-scan results are kept
      JOB_LOG_KEEP: ${JOB_LOG_KEEP:-1000}  # per-job JSON logs kept in the logs volume (0 = keep all)
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media
      - logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets OLLAMA_HOST reach an Ollama server running on the host

  # ==========================================================================
  # CLI Tool - One-shot batch subtitle generation (run manually)
  # ==========================================================================
  # Usage: docker compose run --rm cli
  cli:
    image: ghcr.io/tylerbcrawford/subgeneratorr-cli:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: cli/Dockerfile
    profiles:
      - cli
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:?Set DEEPGRAM_API_KEY in .env}
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      MEDIA_PATH: /media
      BATCH_SIZE: ${BATCH_SIZE:-10}
      LOG_PATH: /logs
      LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media
      - logs:/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  logs:
    driver: local
