# Subgeneratorr — fully-local stack (v3.0.0 local engine)
# https://github.com/tylerbcrawford/subgeneratorr
#
# Runs transcription on your own hardware via faster-whisper (CPU, int8) —
# no Deepgram account or API key needed. Pair with an Ollama server
# (OLLAMA_HOST) for local keyterm generation and subtitle translation, and
# nothing leaves your machine.
#
# Quick start (pulls the published -local images — no clone or build needed):
#   1. Save this file as docker-compose.yml
#   2. Save .env.example as .env and set MEDIA_PATH (DEEPGRAM_API_KEY optional)
#   3. docker compose up -d    (Web UI at http://localhost:5000)
#
# Pin a release with SUBGENERATORR_VERSION=3.3.1 in .env (default: latest).
# Working from a clone? `docker compose up -d --build` builds from source instead.
#
# Expectations vs the cloud engine:
#   - Transcription runs near real-time or faster on a modest CPU with the
#     default `small` model — measured 0.3-0.65x runtime on a low-power
#     Intel N100 (a 40-minute episode takes ~15-25 minutes; budget up to
#     real-time on slower hardware).
#   - Keep worker concurrency at 1 — two whisper jobs will thrash the CPU
#     and can exhaust RAM.
#   - `medium`/`large-v3` models need ~2/~4 GB extra RAM — raise the worker
#     memory limit below before selecting them in the UI.
#   - The default `small` model is baked into the image; other sizes download
#     on first use into the whisper-models volume.

services:
  # ==========================================================================
  # Redis - Task queue broker
  # ==========================================================================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==========================================================================
  # Web UI - Gunicorn app server (-local image)
  # ==========================================================================
  web:
    image: ghcr.io/tylerbcrawford/subgeneratorr-web-local:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: web/Dockerfile
      target: local
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ASR_ENGINE: ${ASR_ENGINE:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}  # optional — only needed to also use the cloud engine
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
      LOG_ROOT: /logs
      SETTINGS_PATH: ${SETTINGS_PATH:-/logs/subgeneratorr-settings.json}  # saved Customize-languages choices
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}  # local Ollama endpoint for offline keyterms and translation
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_THINKING_HEADROOM: ${OLLAMA_THINKING_HEADROOM:-8192}  # extra tokens so thinking models (qwen3) can answer
      DISABLE_AUTH: ${DISABLE_AUTH:-true}
      FRAME_OPTIONS: ${FRAME_OPTIONS-SAMEORIGIN}  # set FRAME_OPTIONS= (empty) in .env to embed the UI in a dashboard iframe
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media
      - logs:/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/healthz | grep ok"]
      interval: 15s
      timeout: 3s
      retries: 5
    ports:
      - "127.0.0.1:${WEB_PORT:-5000}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # lets OLLAMA_HOST reach an Ollama server on the host

  # ==========================================================================
  # Celery Worker - runs the whisper engine (-local image)
  # ==========================================================================
  worker:
    image: ghcr.io/tylerbcrawford/subgeneratorr-worker-local:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: web/Dockerfile
      target: local
    # Concurrency pinned to 1: parallel whisper jobs thrash CPU and RAM.
    command: celery -A tasks.celery_app worker --loglevel=INFO -Q transcribe,scan --concurrency=1
    healthcheck:
      test: ["CMD-SHELL", "celery -A tasks.celery_app inspect ping | grep -q pong || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ASR_ENGINE: ${ASR_ENGINE:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}  # 0 = auto
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}  # optional — only needed to also use the cloud engine
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      REDIS_URL: redis://redis:6379/0
      MEDIA_ROOT: /media
      LOG_ROOT: /logs
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-600}
      OLLAMA_THINKING_HEADROOM: ${OLLAMA_THINKING_HEADROOM:-8192}  # extra tokens so thinking models (qwen3) can answer
      CELERYD_CONCURRENCY: 1
      RESULT_EXPIRES_DAYS: ${RESULT_EXPIRES_DAYS:-7}  # how long batch status and library-scan results are kept
      JOB_LOG_KEEP: ${JOB_LOG_KEEP:-1000}  # per-job JSON logs kept in the logs volume (0 = keep all)
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media
      - logs:/logs
      - whisper-models:/models  # seeds from the baked model; persists larger downloads
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '4.0'   # whisper is CPU-bound; give it the cores you can spare
          memory: 4G    # small fits in ~1 GB; large-v3 needs ~4 GB
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ==========================================================================
  # CLI Tool - One-shot batch subtitle generation (run manually, -local image)
  # ==========================================================================
  # Usage: docker compose run --rm cli
  cli:
    image: ghcr.io/tylerbcrawford/subgeneratorr-cli-local:${SUBGENERATORR_VERSION:-latest}
    # Used only by `docker compose build` / `up --build` from a clone of the repo.
    build:
      context: .
      dockerfile: cli/Dockerfile
      target: local
    profiles:
      - cli
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      ASR_ENGINE: ${ASR_ENGINE:-whisper}
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE:-int8}
      WHISPER_CPU_THREADS: ${WHISPER_CPU_THREADS:-0}  # 0 = auto
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}  # optional — only for ASR_ENGINE=deepgram
      DEEPGRAM_TIMEOUT: ${DEEPGRAM_TIMEOUT:-900}
      MEDIA_PATH: /media
      BATCH_SIZE: ${BATCH_SIZE:-10}
      LOG_PATH: /logs
      LANGUAGE: ${DEFAULT_LANGUAGE:-en}
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media
      - logs:/logs
      - whisper-models:/models  # shared with the worker; persists larger downloads
    deploy:
      resources:
        limits:
          cpus: '4.0'   # whisper is CPU-bound; give it the cores you can spare
          memory: 4G    # small fits in ~1 GB; large-v3 needs ~4 GB

volumes:
  logs:
    driver: local
  whisper-models:
    driver: local
