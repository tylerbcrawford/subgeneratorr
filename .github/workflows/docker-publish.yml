name: Build and Publish Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # Gate: run tests before any image is built or pushed.
  # build-and-push will not start unless this job succeeds.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m compileall cli core web scripts tests
      - run: pytest tests/ -v
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  build-and-push:
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: subgeneratorr-web
            dockerfile: web/Dockerfile
            context: .
          - image: subgeneratorr-worker
            dockerfile: web/Dockerfile
            context: .
          - image: subgeneratorr-cli
            dockerfile: cli/Dockerfile
            context: .
          # -local variants: faster-whisper + baked small model (v3.0.0)
          - image: subgeneratorr-web-local
            dockerfile: web/Dockerfile
            context: .
            target: local
          - image: subgeneratorr-worker-local
            dockerfile: web/Dockerfile
            context: .
            target: local
          - image: subgeneratorr-cli-local
            dockerfile: cli/Dockerfile
            context: .
            target: local

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto: only move :latest for a real (non-prerelease) release, so
          # pre-release tags like v2.4.0-beta.1 publish their own tag without
          # clobbering the :latest that existing users pull.
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Report-only: surfaces fixable HIGH/CRITICAL CVEs in the build log.
          # Non-blocking (exit-code 0 + continue-on-error) so CVE noise never blocks a release.
          exit-code: '0'
