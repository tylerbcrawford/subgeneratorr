name: Build and Publish Docker Images

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io

jobs:
  # Gate: run tests before any image is built or pushed.
  # build-and-push will not start unless this job succeeds.
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python3 -m compileall cli core web scripts tests
      - run: pytest tests/ -v
      - run: pip install 'ruff==0.17.1'  # exact pin, same as ci.yml
      - run: ruff check .
      - run: ruff format --check .

  build-and-push:
    runs-on: ubuntu-latest
    needs: ci-gate
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: subgeneratorr-web
            dockerfile: web/Dockerfile
            context: .
            description: "Subgeneratorr Web UI — generate & translate subtitles for Plex, Jellyfin, and Emby with Deepgram Nova-3 (keyterm prompting, LLM translation into 98 languages)"
          - image: subgeneratorr-worker
            dockerfile: web/Dockerfile
            context: .
            description: "Subgeneratorr worker — Celery batch transcription and library-scan worker for the Subgeneratorr Web UI (Deepgram Nova-3)"
          - image: subgeneratorr-cli
            dockerfile: cli/Dockerfile
            context: .
            description: "Subgeneratorr CLI — headless batch subtitle generation for Plex, Jellyfin, and Emby via Deepgram Nova-3"
          # -local variants: faster-whisper + baked small model (v3.0.0)
          - image: subgeneratorr-web-local
            dockerfile: web/Dockerfile
            context: .
            target: local
            description: "Subgeneratorr Web UI (local) — fully offline subtitle generation with faster-whisper on CPU: no API key, $0, small model baked in"
          - image: subgeneratorr-worker-local
            dockerfile: web/Dockerfile
            context: .
            target: local
            description: "Subgeneratorr worker (local) — offline Celery transcription worker using faster-whisper on CPU"
          - image: subgeneratorr-cli-local
            dockerfile: cli/Dockerfile
            context: .
            target: local
            description: "Subgeneratorr CLI (local) — fully offline batch subtitle generation with faster-whisper on CPU; no API key needed"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          # latest=auto: only move :latest for a real (non-prerelease) release, so
          # pre-release tags like v2.4.0-beta.1 publish their own tag without
          # clobbering the :latest that existing users pull.
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # matrix description last so it overrides the repo-level description
          # from metadata-action — each GHCR package page gets its own blurb.
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.description=${{ matrix.description }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        continue-on-error: true
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Report-only: surfaces fixable HIGH/CRITICAL CVEs in the build log.
          # Non-blocking (exit-code 0 + continue-on-error) so CVE noise never blocks a release.
          exit-code: '0'
